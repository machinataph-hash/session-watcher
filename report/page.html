:root[data-theme="dark"] {

.top { display: flex; flex-wrap: wrap; gap: 1ch; align-items: baseline; justify-content: space-between; }
.top .src { color: var(--muted); font-size: 11px; }
.card { border: 1px solid var(--border); background: var(--card); padding: 8px 1ch; display: flex; flex-direction: column; min-width: 0; border-radius: 4px; }
.card.open { gap: 1.45em; }
.row { display: flex; flex-direction: row; gap: 1ch; align-items: center; min-width: 0; }
.col { display: flex; flex-direction: column; min-width: 0; }
.gap { gap: 1.45em; }
.grow { flex: 1 1 0; min-width: 0; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dim { color: var(--muted); }
.b { font-weight: 600; }
.h { font-weight: 700; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot { font-size: 11px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.big { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.p > span { white-space: pre; }
button.p { all: unset; cursor: pointer; display: inline-flex; gap: 0; align-items: baseline; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 3px; }
button.p:focus-visible, button.btn:focus-visible { outline: 2px solid var(--claude); outline-offset: 2px; }
button.btn { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--border); border-radius: 5px; padding: 2px 10px; cursor: pointer; }
button.btn:hover, button.p:hover { color: var(--claude); }
.cog { font-size: 16px; line-height: 1; font-weight: 700; }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; display: flex; flex: 1 1 0; min-width: 0; }
.bar > i { display: block; height: 100%; }
.barrow { height: 1.45em; display: flex; align-items: center; }
.rule { height: 1px; background: var(--rule); margin: .7em 0; }
.sw8 { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.cell { flex: 0 0 auto; display: flex; min-width: 0; }
.r { justify-content: flex-end; text-align: right; }
.gridrow { display: flex; gap: 1ch; }
.gridrow > div { flex: 1 1 0; min-width: 0; }
.ind { padding-left: 1ch; }
.warn { font-size: 11px; }
.note-sample { color: var(--warning); font-size: 11px; }
</style>

<script>
(() => {
const S = JSON.parse(document.getElementById('state').textContent)

const root = document.getElementById('sw')
// Per-viewer settings, as the pane keeps them in $.state: open sections, layout (order, hidden, theme, extras).
const KEY = 'session-watcher:v1'
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null') } catch { return null } }
const saved = load() || {}
let open = saved.open || ['session', 'tasks']
let lay = Object.assign({ order: S.order || SECTIONS.map(s => s.id), hidden: S.hidden || [], cards: {} }, saved.lay || {})
for (const s of SECTIONS) if (!lay.order.includes(s.id)) lay.order.push(s.id)

const targetSteppers = () => h('div', { class: 'col gap' }, heading('Targets · what the bars are coloured by'),
  h('div', { class: 'col' }, TARGETS.map(d => h('div', { class: 'row' }, h('div', { class: 'grow trunc dim' }, d.label),

    cellW(9, T(tg[d.id].toLocaleString('en-US'), 'num b', tg[d.id] !== d.value ? 'claude' : undefined)),
    pressable([{ text: '+', bold: canStep(lay, d.id, 1), dim: !canStep(lay, d.id, 1) }], () => setLay({ target: { id: d.id, by: 1 } }), `Raise ${d.label}`)))),
  lay.targets ? pressable([{ text: '↺ Back to the defaults', dim: true }], () => setLay({ target: 'reset' })) : null)

// ---- tiny element helper
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag)
  for (const [a, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue
    if (a === 'class') el.className = v
    else if (a === 'style') el.style.cssText = v
    else if (a.startsWith('on')) el.addEventListener(a.slice(2), v)
    else el.setAttribute(a, v)

  const tot = track ? 1 : parts.reduce((a, p) => a + p.value, 0) || 1
  return h('div', { class: 'bar', role: 'img', 'aria-label': parts.map(p => `${p.color} ${Math.round(p.value * 100) / 100}`).join(', ') },

// DESIGN 6: equal columns wall to wall, the most that fit at `min`, stepping down one at a time; short rows padded.
const grid = (items0, min, cols) => {
  const items = items0.filter(Boolean)
  const target = Math.max(cols ?? items.length, items.length)
  const fits = c => c * min + (c - 1) * COL_GAP <= inner
  const per = Array.from({ length: target }, (_, i) => target - i).find(fits) ?? 1
  const rows = []
  for (let i = 0; i < items.length; i += per) rows.push(items.slice(i, i + per))
  return h('div', { class: 'col gap' }, rows.map(r => h('div', { class: 'gridrow' }, [...r, ...Array(per - r.length).fill(null)].map(it => h('div', {}, it)))))
}
const stat = (label, value, o = {}) => h('div', { class: 'col' }, heading(label), T(value, 'big', o.color), o.sub ? T(o.sub, 'foot dim num trunc') : null)
const stats = (items, cols) => grid(items, STAT_MIN, cols)
// DESIGN 7: one column list for header and rows; free column grows; numbers 8 wide, right-aligned; stacks when narrow.
const table = (cols0, rows, room = inner, after) => {
  const cols = cols0.filter(Boolean)
  const min = 10 + cols.filter(c => c.kind !== 'free').reduce((a, c) => a + (c.kind === 'num' ? NUM_W : c.w ?? NUM_W) + 1, 0)
  const box = (c, node) => c.kind === 'free' ? h('div', { class: 'grow trunc' }, node) : cellW(c.kind === 'num' ? NUM_W : c.w ?? NUM_W, node, c.kind === 'num')

    h('div', { class: 'row' }, cols.map(c => box(c, c.kind === 'mark' ? null : heading(c.label)))),
    rows.map(r => h('div', { class: 'row' }, cols.map(c => box(c, r[c.id] ?? null)))), after || null)
  return h('div', { class: 'col gap' }, rows.map(r => h('div', { class: 'col' },
    cols.filter(c => c.kind === 'free').map(c => h('div', { class: 'trunc' }, r[c.id])),
    cols.filter(c => c.kind === 'num' || c.kind === 'text').map(c => h('div', { class: 'row', style: 'justify-content:space-between' }, T(c.label, 'dim trunc'), h('div', {}, r[c.id]))))), after || null)
}
const pressable = (runs, onPress, label) => h('button', { class: 'p', onclick: onPress, 'aria-label': label },
  runs.map(r => h('span', { class: `${r.bold ? 'b' : ''} ${r.dim ? 'dim' : ''} ${r.mono ? 'mono' : ''} ${r.cls || ''}`, style: r.color ? `color:var(--${r.color})` : undefined }, r.text)))

const extraTicks = card => h('div', { class: 'col ind' }, (EXTRAS[card] || []).map(d => {
  const on = extrasOf(card)[d.key]
  return pressable([tickRun(on), { text: `  ${d.label}`, dim: !on }], () => { lay.cards[card] = { ...(lay.cards[card] || {}), [d.key]: !on }; save(); draw() })
}))
// THE CARD TEMPLATE (DESIGN 2).

  const shownEvents = extrasOf('log').info ? events : events.filter(l => l.kind !== 'info')
  const logBody = () => shownEvents.length === 0 ? [T('Nothing yet.', 'dim')] : [h('div', { class: 'col' }, shownEvents.slice(-20).reverse().map(l => h('div', { class: 'row' },
    cellW(NUM_W, T(hhmm(l.at), 'dim num'), false), isNarrow ? null : cellW(10, T(l.who, 'trunc', l.kind === 'error' ? 'error' : l.kind === 'done' ? 'success' : undefined), false),
    h('div', { class: `grow trunc ${l.kind === 'info' ? 'dim' : ''}`, style: l.kind === 'error' ? 'color:var(--error)' : undefined }, l.text))))]

  const errorsNow = events.filter(l => l.kind === 'error').length
  const byId = {
    session: () => section('session', 'Session Totals', hasScan ? `main ${usd(mainCost)} · agents ${usd(agentCost)}` : '—', sessionBody, costNote),
    tasks: () => section('tasks', 'Tasks', `${shownTasks.length} · now: ${last?.label ?? '—'}`, tasksBody),
    requests: () => section('requests', 'Recent Requests', `${callList.length} seen`, requestsBody),
    agents: () => section('agents', 'Sub-Agents', agentCount === 0 ? 'none' : `${running} running`, agentsBody),
    gate: () => section('gate', 'Permissions', `${gt.allowed} ok · ${gt.asked} asked · ${gt.denied} denied`, gateBody),
    cache: () => section('cache', 'Cache', hitRate !== null ? `${Math.round(100 * hitRate)}% hit${ch0 && ch0.memoryChars !== null ? ` · ${memWord}` : ''}` : '—', cacheBody, targetSteppers),
    turn: () => section('turn', 'Last Turn', rc ? `${dur(rc.durationMs)}${rc.costDelta !== null ? ` · +${usd(rc.costDelta * factor)}` : ''}` : '—', turnBody),
    log: () => section('log', 'Activity', errorsNow > 0 ? `${events.length} events · ${errorsNow} errors` : `${events.length} events`, logBody),
  }
  root.replaceChildren(
    h('div', { class: 'top' }, T(`Updated ${when(now)}:${String(new Date(now).getSeconds()).padStart(2, '0')}`, 'b'), T('Published by the Session Watcher mod after each request.', 'src')),
    vitalsCard,
    ...lay.order.filter(id => !lay.hidden.includes(id)).map(id => byId[id]?.()),
    T((isCalibrated ? 'Cost is Claude Code’s own total. Each row’s cost is its tokens at list price, scaled so the rows add up to that total.' : 'Cost is an estimate at list price until Claude Code reports the session cost.') + ' Cost per request = cost ÷ requests, both from the same transcript read. Weighted = input ×1 + cache write ×1.25 (five-minute cache) or ×2 (one-hour cache) + cache read ×0.1 + output ×5. Fresh = input + cache write + output.', 'foot dim'),
  )

  // CSV, as the pane's Copy buttons build it.
  function tasksCsv() { return ['task,started,minutes,calls,input,cache_write,cache_read,output,usd', ...list.map(t => { const u = taskTotal(t); return [JSON.stringify(t.label), new Date(t.startedAt).toISOString(), mins(t), u.calls, u.input, u.cacheWrite, u.cacheRead, u.output, (u.usd * factor).toFixed(4)].join(',') })].join('\n') }
  function callsCsv() { return ['time,task,who,model,input,cache_write,cache_read,output,usd', ...callList.map(c => [new Date(c.at).toISOString(), JSON.stringify(c.task), JSON.stringify(c.who), c.model, c.input, c.cacheWrite, c.cacheRead, c.output, (c.usd * factor).toFixed(4)].join(','))].join('\n') }
}
async function copy(ev, text) {
  const note = root.querySelector('.copied')
  try { await navigator.clipboard.writeText(text); if (note) note.textContent = 'Copied.' }
  catch { if (note) note.textContent = 'Copy failed: your browser refused the clipboard.' }
}
draw()
let w = root.clientWidth
new ResizeObserver(() => { if (root.clientWidth !== w) { w = root.clientWidth; draw() } }).observe(root)
})()
</script>
