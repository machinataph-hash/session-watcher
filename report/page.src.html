<title>Session Watcher Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The pane on the desktop surface: the app's adaptive colours (Original), cards in a column, one cell = 1ch. */
:root {
  --bg: #fbfaf8; --card: #ffffff; --fg: #1f1e1c; --muted: #6e6b66; --border: #dcd9d3;
  --claude: #c2572f; --suggestion: #3b78c4; --success: #2a8a43; --warning: #b5761a; --error: #c23b3b;
  --text: #6b6b6b; --merged: #8e5bd6; --bashBorder: #c94a8a; --planMode: #23968a; --inactive: #a8a8a8; --permission: #6c73e0;
  --track: rgba(138,138,138,.18); --rule: rgba(138,138,138,.45);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1c1a; --card: #262522; --fg: #ecebe8; --muted: #a29e97; --border: #3d3b37;
  --claude: #e0794f; --suggestion: #6ea6ef; --success: #4cbf6a; --warning: #e5a443; --error: #ec6a6a;
  --text: #a8a8a8; --merged: #a985e6; --bashBorder: #ea6fae; --planMode: #3cb8aa; --inactive: #7d7d7d; --permission: #8f95f5;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1d1c1a; --card: #262522; --fg: #ecebe8; --muted: #a29e97; --border: #3d3b37;
  --claude: #e0794f; --suggestion: #6ea6ef; --success: #4cbf6a; --warning: #e5a443; --error: #ec6a6a;
  --text: #a8a8a8; --merged: #a985e6; --bashBorder: #ea6fae; --planMode: #3cb8aa; --inactive: #7d7d7d; --permission: #8f95f5;
  color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font); }
#sw { max-width: 760px; margin: 0 auto; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 1.45em; }
#sw.themed { background: var(--bg); }
.top { display: flex; flex-wrap: wrap; gap: 1ch; align-items: baseline; justify-content: space-between; }
.top .src { color: var(--muted); font-size: 11px; }
.card { border: 1px solid var(--border); background: var(--card); padding: 8px 1ch; display: flex; flex-direction: column; min-width: 0; border-radius: 4px; }
.card.open { gap: 1.45em; }
.row { display: flex; flex-direction: row; gap: 1ch; align-items: center; min-width: 0; }
.col { display: flex; flex-direction: column; min-width: 0; }
.gap { gap: 1.45em; }
.grow { flex: 1 1 0; min-width: 0; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dim { color: var(--muted); }
.b { font-weight: 600; }
.h { font-weight: 700; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot { font-size: 11px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.big { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.p > span { white-space: pre; }
button.p { all: unset; cursor: pointer; display: inline-flex; gap: 0; align-items: baseline; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 3px; }
button.p:focus-visible, button.btn:focus-visible { outline: 2px solid var(--claude); outline-offset: 2px; }
button.btn { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--border); border-radius: 5px; padding: 2px 10px; cursor: pointer; }
button.btn:hover, button.p:hover { color: var(--claude); }
.tick { font-size: 1.2em; line-height: 1; }
.cog { font-size: 16px; line-height: 1; font-weight: 700; }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; display: flex; flex: 1 1 0; min-width: 0; }
.bar > i { display: block; height: 100%; }
.barrow { height: 1.45em; display: flex; align-items: center; }
.rule { height: 1px; background: var(--rule); margin: .7em 0; }
.sw8 { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.cell { flex: 0 0 auto; display: flex; min-width: 0; }
.r { justify-content: flex-end; text-align: right; }
.gridrow { display: flex; gap: 1.5ch; }
.gridrow > div { flex: 1 1 0; min-width: 0; }
.ind { padding-left: 1ch; }
.warn { font-size: 11px; }
.picker { gap: 1ch; }
.picker select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; min-width: 0; flex: 1 1 auto; }
.note-sample { color: var(--warning); font-size: 11px; }
</style>
<div id="sw" aria-live="polite"></div>
<script>__CORE__</script>
<script id="state" type="application/json">__STATE__</script>
<script>
(() => {
// The state built into the page, replaced by the page's database once it answers: one document per session
// (sessions/<id>) and the newest plan-limit reading from any session (limits/latest).
let S = JSON.parse(document.getElementById('state').textContent)
let sessions = [], LIM = null
const { k, usd, clock, dur, hhmm, when, untilReset, modelName, familyOf, weighted, writeCost, fresh, sum, empty, taskTotal, scanTotal, newTask, EXTRAS, SECTIONS, TARGETS, THEMES, BUCKETS, targetsOf, canStep, applyLayoutMessage } = SW
const root = document.getElementById('sw')
// Per-viewer settings, as the pane keeps them in $.state: open sections, layout (order, hidden, theme, extras).
const KEY = 'session-watcher:v1'
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null') } catch { return null } }
const saved = load() || {}
let open = saved.open || ['session', 'tasks']
let lay = Object.assign({ order: S.order || SECTIONS.map(s => s.id), hidden: S.hidden || [], cards: {} }, saved.lay || {})
for (const s of SECTIONS) if (!lay.order.includes(s.id)) lay.order.push(s.id)
let toggles = saved.toggles || []
let pick = saved.pick || null
let dayRange = Math.min(30, Math.max(1, Number(saved.dayRange) || 7))
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ open, lay, toggles, pick, dayRange })) } catch {} }
const isOpen = id => open.includes(id)
const flip = id => { open = isOpen(id) ? open.filter(x => x !== id) : [...open, id]; save(); draw() }
const extrasOf = card => Object.fromEntries((EXTRAS[card] || []).map(d => [d.key, (lay.cards[card] || {})[d.key] ?? d.isOn]))
// The limits the bars are coloured by: the defaults, or what this viewer set in the Cache card's ⚙.
let tg = targetsOf(lay)
const setLay = msg => { lay = { cards: {}, ...applyLayoutMessage(lay, msg) }; tg = targetsOf(lay); save(); draw() }
const targetSteppers = () => h('div', { class: 'col gap' }, heading('Targets · what the bars are coloured by'),
  h('div', { class: 'col' }, TARGETS.map(d => h('div', { class: 'row' }, h('div', { class: 'grow trunc dim' }, d.label),
    pressable([{ text: '−', bold: canStep(lay, d.id, -1), dim: !canStep(lay, d.id, -1) }], () => setLay({ target: { id: d.id, by: -1 } }), `Lower ${d.label}`),
    cellW(9, T(tg[d.id].toLocaleString('en-US'), 'num b', tg[d.id] !== d.value ? 'claude' : undefined)),
    pressable([{ text: '+', bold: canStep(lay, d.id, 1), dim: !canStep(lay, d.id, 1) }], () => setLay({ target: { id: d.id, by: 1 } }), `Raise ${d.label}`)))),
  lay.targets ? pressable([{ text: '↺ Back to the defaults', dim: true }], () => setLay({ target: 'reset' })) : null)

// ---- tiny element helper
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag)
  for (const [a, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue
    if (a === 'class') el.className = v
    else if (a === 'style') el.style.cssText = v
    else if (a.startsWith('on')) el.addEventListener(a.slice(2), v)
    else el.setAttribute(a, v)
  }
  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)))
  return el
}
const T = (text, cls = '', color) => h('span', { class: cls, style: color ? `color:var(--${color})` : undefined }, text)
const heading = text => h('div', { class: 'h' }, text)
const n = (v, o = {}) => T(v, `num foot ${o.bold ? 'b' : ''} ${o.dim ? 'dim' : ''}`, o.color)
const cellW = (w, node, right = true) => h('div', { class: `cell ${right ? 'r' : ''}`, style: `width:${w}ch` }, node)
const NUM_W = 8, STAT_MIN = 12, GROUP_MIN = 24, COL_GAP = 1, KIND_W = 11

let inner = 60
// DESIGN 9: label/value row.
const labelValue = (label, note, value) => h('div', { class: 'row', style: 'justify-content:space-between' },
  h('div', { class: 'grow' }, heading(label)),
  h('div', { class: 'row', style: 'flex:0 0 auto' }, note ? T(note, 'num dim') : null, value ? T(value.text, 'num b', value.color) : null))
// Bars: a continuous bar, one part per value; with a track, the rest is the dim track.
const strip = (parts, track) => {
  const tot = track ? 1 : parts.reduce((a, p) => a + p.value, 0) || 1
  return h('div', { class: 'bar', role: 'img', 'aria-label': parts.map(p => `${p.color} ${Math.round(p.value * 100) / 100}`).join(', ') },
    parts.map(p => h('i', { style: `width:${Math.max(0, Math.min(100, (100 * p.value) / tot))}%;background:var(--${p.color})` })))
}
const barRow = parts => h('div', { class: 'barrow' }, strip(parts, true))
const swatch = color => h('span', { class: 'sw8', style: `background:var(--${color})` })
const rule = () => h('div', { class: 'rule', role: 'separator' })
// DESIGN 6: equal columns wall to wall, the most that fit at `min`, stepping down one at a time; short rows padded.
const grid = (items0, min, cols) => {
  const items = items0.filter(Boolean)
  const target = Math.max(cols ?? items.length, items.length)
  const fits = c => c * min + (c - 1) * COL_GAP <= inner
  const per = Array.from({ length: target }, (_, i) => target - i).find(fits) ?? 1
  const rows = []
  for (let i = 0; i < items.length; i += per) rows.push(items.slice(i, i + per))
  return h('div', { class: 'col gap' }, rows.map(r => h('div', { class: 'gridrow' }, [...r, ...Array(per - r.length).fill(null)].map(it => h('div', { style: it && it.dataset.grow ? `flex-grow:${it.dataset.grow}` : undefined }, it)))))
}
// o.since: a clock the page itself keeps running from that time, so it moves between publishes.
const stat = (label, value, o = {}) => h('div', { class: 'col', 'data-grow': o.grow }, heading(label), o.since ? h('span', { class: 'big', 'data-since': o.since }, value) : T(value, 'big', o.color), o.sub ? T(o.sub, 'foot dim num trunc') : null)
const stats = (items, cols) => grid(items, STAT_MIN, cols)
// DESIGN 7: one column list for header and rows; free column grows; numbers 8 wide, right-aligned; stacks when narrow.
const table = (cols0, rows, room = inner, after) => {
  const cols = cols0.filter(Boolean)
  const min = 10 + cols.filter(c => c.kind !== 'free').reduce((a, c) => a + (c.kind === 'num' ? NUM_W : c.w ?? NUM_W) + 1, 0)
  const box = (c, node) => c.kind === 'free' ? h('div', { class: 'grow trunc' }, node) : cellW(c.kind === 'num' ? NUM_W : c.w ?? NUM_W, node, c.kind === 'num')
  if (room >= min) return h('div', { class: 'col' },
    h('div', { class: 'row' }, cols.map(c => box(c, c.kind === 'mark' ? null : heading(c.label)))),
    rows.map(r => h('div', { class: 'row' }, cols.map(c => box(c, r[c.id] ?? null)))), after || null)
  return h('div', { class: 'col gap' }, rows.map(r => h('div', { class: 'col' },
    cols.filter(c => c.kind === 'free').map(c => h('div', { class: 'trunc' }, r[c.id])),
    cols.filter(c => c.kind === 'num' || c.kind === 'text').map(c => h('div', { class: 'row', style: 'justify-content:space-between' }, T(c.label, 'dim trunc'), h('div', {}, r[c.id]))))), after || null)
}
const pressable = (runs, onPress, label) => h('button', { class: 'p', onclick: onPress, 'aria-label': label },
  runs.map(r => h('span', { class: `${r.bold ? 'b' : ''} ${r.dim ? 'dim' : ''} ${r.mono ? 'mono' : ''} ${r.cls || ''}`, style: r.color ? `color:var(--${r.color})` : undefined }, r.text)))
const arrowRun = on => ({ text: on ? '▾ ' : '▸ ', dim: true })
const tickRun = on => ({ text: on ? '☑' : '☐', color: on ? 'claude' : undefined, dim: !on, bold: on, mono: true, cls: 'tick' })
const cog = (on, onPress) => pressable([{ text: '⚙', color: 'claude', cls: 'cog' }], onPress, 'Card settings')
const extraTicks = card => h('div', { class: 'col ind' }, (EXTRAS[card] || []).map(d => {
  const on = extrasOf(card)[d.key]
  return pressable([tickRun(on), { text: `  ${d.label}`, dim: !on }], () => { lay.cards[card] = { ...(lay.cards[card] || {}), [d.key]: !on }; save(); draw() })
}))
// THE CARD TEMPLATE (DESIGN 2).
const card = o => h('section', { class: `card ${o.isOpen || o.isMenuOpen ? 'open' : ''}`, id: o.id },
  h('div', { class: 'row' }, h('div', { class: 'grow' }, o.title), o.summary ? h('div', { class: 'trunc dim num', style: 'flex:0 1 auto' }, o.summary) : null, o.onCog ? h('div', { style: 'flex:0 0 auto' }, cog(o.isMenuOpen, o.onCog)) : null),
  o.isMenuOpen ? h('div', { class: 'col' }, rule(), h('div', { class: 'col gap' }, o.items), rule()) : null,
  o.isOpen && o.body ? h('div', { class: 'col gap' }, o.body()) : null)
const section = (id, title, summary, body, more) => {
  const hasMenu = (EXTRAS[id] || []).length > 0 || !!more
  return card({ id, title: pressable([arrowRun(isOpen(id)), { text: title, bold: true }], () => flip(id)), summary,
    onCog: hasMenu ? () => flip(`menu:${id}`) : undefined, isMenuOpen: hasMenu && isOpen(`menu:${id}`),
    items: [(EXTRAS[id] || []).length ? heading('Show in this card') : null, (EXTRAS[id] || []).length ? extraTicks(id) : null, more ? more() : null],
    isOpen: isOpen(id), body })
}

// Every running clock moves each second by the viewer's own clock, not only when the mod publishes.
setInterval(() => { for (const el of document.querySelectorAll('[data-since]')) el.textContent = clock(Math.max(0, Date.now() - Number(el.getAttribute('data-since')))) }, 1000)

function draw() {
  // Cells across: the card's inner width in the body face's `ch`.
  const probe = h('span', { style: 'position:absolute;visibility:hidden' }, '0'.repeat(100)); document.body.append(probe)
  const ch = probe.getBoundingClientRect().width / 100 || 7; probe.remove()
  const cols = Math.max(28, Math.floor((root.clientWidth || 600) / ch) - 2)
  inner = cols - 4
  const isWide = inner >= 50, isNarrow = cols < 40
  const theme = lay.theme ? THEMES[lay.theme] : undefined
  if (theme) {
    const s = document.documentElement.style
    for (const [a, b] of [['bg', theme.bg], ['card', theme.card], ['fg', theme.fg], ['muted', theme.muted], ['border', theme.border]]) s.setProperty(`--${a}`, b)
    for (const [a, b] of Object.entries(theme.keys)) s.setProperty(`--${a}`, b)
    s.setProperty('--claude', theme.accent)
    document.documentElement.style.colorScheme = theme.name === 'Reader' ? 'light' : 'dark'
  } else document.documentElement.removeAttribute('style')

  const now = S.exportedAt, sc = S.scan, v = S.vitals, list = S.tasks.length ? S.tasks : [newTask('Unlabelled', now)]
  const callList = S.calls, cards = S.agents, g = S.gate, rc = S.receipt, events = S.log, ch0 = sc.cache
  const startedAt = S.sessionStart
  const hasScan = Object.keys(sc.byModel).length > 0
  const total = hasScan ? scanTotal(sc) : list.reduce((a, t) => sum(a, taskTotal(t)), empty())
  const snapCost = hasScan && sc.costUsd != null ? sc.costUsd : (v.costUsd ?? total.usd)
  const f0 = total.usd > 0 ? snapCost / total.usd : 1, factor = Number.isFinite(f0) && f0 > 0 ? f0 : 1
  const isCalibrated = sc.costUsd != null && total.usd > 0
  const perReq = (cost, c) => (c > 0 ? usd(cost / c) : '—')
  const mainU = Object.values(sc.byModel).reduce((a, x) => sum(a, x.main), empty())
  const agentU = Object.values(sc.byModel).reduce((a, x) => sum(a, x.agents), empty())
  const mainCost = mainU.usd * factor, agentCost = hasScan ? Math.max(0, snapCost - mainCost) : agentU.usd * factor
  const agentCount = new Set([...list.flatMap(t => t.agents.map(a => a.id)), ...cards.map(c => c.id)]).size
  const inputAll = total.input + total.cacheWrite + total.cacheRead
  const hitRate = inputAll > 0 ? total.cacheRead / inputAll : null
  const FAMILY = { fable: 'merged', mythos: 'merged', opus: 'bashBorder', sonnet: 'planMode', haiku: 'inactive', other: 'permission' }
  const whoColor = r => (r.type === 'main' ? 'text' : FAMILY[familyOf(r.models[0] || '')] || 'permission')
  const KINDS = [
    { field: 'input', name: 'input', cost: u => u.input, color: 'success' },
    { field: 'cacheWrite', name: 'cache write', cost: writeCost, color: 'warning' },
    { field: 'cacheRead', name: 'cache read', cost: u => u.cacheRead * 0.1, color: 'error' },
    { field: 'output', name: 'output', cost: u => u.output * 5, color: 'claude' },
  ]

  // ---- Main card
  const isShared = LIM && Array.isArray(LIM.limits) && LIM.at >= now
  const lims = isShared ? LIM.limits : v.limits, limAt = isShared ? LIM.at : now, limFrom = isShared ? LIM.session : S.sessionId
  const ctxMax = v.ctxLimit > 0 ? v.ctxLimit : v.ctxWindow
  const ctxPct = v.ctxTokens !== null && ctxMax > 0 ? Math.round((100 * v.ctxTokens) / ctxMax) : v.ctxLimit > 0 ? null : v.ctxPct
  const ctxColor = ctxPct === null ? 'inactive' : ctxPct >= tg.ctxBad ? 'error' : ctxPct >= tg.ctxWarn ? 'warning' : 'success'
  const runFor = now - startedAt, actMs = S.active.hist + S.active.ms
  const todayStart = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() })()
  const todayHours = (sc.hours || []).filter(x => x.at + 3600000 > todayStart)
  const todayUsd = todayHours.reduce((a, x) => a + x.usage.usd, 0), todayCalls = todayHours.reduce((a, x) => a + x.usage.calls, 0)
  const mainEx = extrasOf('vitals')
  const memColor = !ch0 || ch0.memoryChars === null ? 'inactive' : ch0.memoryChars > tg.memFine ? 'error' : ch0.memoryChars > tg.memGood ? 'warning' : 'success'
  const memWord = memColor === 'error' ? 'Bad' : memColor === 'warning' ? 'Fine' : 'Good'
  const settingsOpen = isOpen('settings-open'), vitalsOpen = !isOpen('vitals-folded')
  const allIds = [...lay.order, ...Object.keys(EXTRAS).map(id => `menu:${id}`)]
  const allOpen = allIds.every(id => open.includes(id))
  const titleOf = id => SECTIONS.find(x => x.id === id)?.title ?? id
  const LABEL_W = isNarrow ? 8 : 13
  const meterRow = (label, value, color, shown, note) => h('div', { class: 'row' },
    h('div', { class: 'cell', style: `width:${LABEL_W}ch` }, T(label, 'dim trunc')), strip([{ value, color }], true), cellW(8, shown), isNarrow ? null : cellW(10, T(note, 'dim num foot trunc')))
  const group = (label, note, body) => h('div', { class: 'col gap' }, h('div', { class: 'col' }, heading(label), T(note, 'foot dim')), body)
  const chips = h('div', { class: 'col' }, lay.order.map((id, i) => {
    const shown = !lay.hidden.includes(id)
    return h('div', { class: 'row ind', style: 'gap:0' },
      h('div', { class: 'cell', style: 'width:3ch' }, i > 0 ? pressable([{ text: '↑', dim: true }], () => { lay.order = lay.order.filter(x => x !== id); lay.order.splice(i - 1, 0, id); save(); draw() }, `Move ${titleOf(id)} up`) : null),
      pressable([tickRun(shown), { text: `  ${titleOf(id)}`, dim: !shown }], () => { lay.hidden = shown ? [...lay.hidden, id] : lay.hidden.filter(x => x !== id); save(); draw() }))
  }))
  const themeChoices = [{ id: 'app', name: 'Original' }, ...Object.entries(THEMES).map(([id, t]) => ({ id, name: t.name }))]
  const vitalsCard = card({ id: 'main',
    title: pressable([{ text: '● ', color: v.isRunning ? 'claude' : 'success', bold: true }, { text: v.model ? modelName(v.model) : 'Session', bold: true }, ...(v.effort ? [{ text: ` · ${v.effort}`, dim: true }] : []), ...(v.mode ? [{ text: ` · ${v.mode}`, dim: true }] : [])], () => flip('vitals-folded')),
    summary: `${v.isRunning ? 'working' : 'idle'}${mainEx.ttft ? ` · first token ${v.ttftMs != null ? dur(v.ttftMs) : '—'}` : ''}`,
    onCog: () => flip('settings-open'), isMenuOpen: settingsOpen,
    items: [
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => { open = allOpen ? open.filter(x => !allIds.includes(x)) : [...new Set([...open, ...allIds])]; save(); draw() } }, allOpen ? 'Collapse all' : 'Open all')),
      grid([
        group('Cards', 'Tick to show, ↑ to move. Each card has its own ⚙ for its extras.', chips),
        group('Main card', 'Extras shown in this card.', extraTicks('vitals')),
        group('Refresh', 'A preference, 10s by default. The page cannot reach the mod, so set it in the pane’s ⚙ or with the command.', h('div', { class: 'col ind' },
          T(`Every ${S.liveEveryS ?? 10}s`, 'num b'), T(`/session-watcher live <1–20>`, 'foot dim num'),
          (S.liveEveryS ?? 10) < 2 ? T('⚠ 1s republishes after almost every request; your browser or claude.ai may lag. Raise it if the page stutters.', 'foot', 'warning') : null)),
        group('This page', 'Bookmark this page’s link rather than pinning it in the Claude sidebar: a pin reopens the session that first published the page, not the one you are working in.', h('div', { class: 'col ind' }, T('Session picker: Follow newest, or one fixed session.', 'foot dim'))),
        group('Theme', 'Colours for the whole page.', h('div', { class: 'col ind' }, themeChoices.map(o => {
          const on = (lay.theme ?? 'app') === o.id
          return pressable([tickRun(on), { text: `  ${o.name}`, dim: !on }], () => { lay.theme = o.id === 'app' ? undefined : o.id; save(); draw() })
        }))),
      ], GROUP_MIN),
    ],
    isOpen: true,
    body: () => [
      h('div', { class: 'col' },

  }
  root.replaceChildren(
    h('div', { class: 'top' }, T(`Updated ${when(now)}:${String(new Date(now).getSeconds()).padStart(2, '0')}`, 'b'), T(sessions.length ? 'Live from the Session Watcher mod.' : 'Published by the Session Watcher mod.', 'src')),
    sessions.length > 1 ? h('label', { class: 'row picker' }, T('Session', 'h'), h('select', { onchange: ev => { pick = ev.target.value || null; save(); choose() } },
      [h('option', { value: '', selected: pick ? undefined : '' }, 'Follow newest'),
        ...sessions.map(x => h('option', { value: x.id, selected: pick && x.id === S.sessionId ? '' : undefined }, `${when(x.updatedAt)}${x.where ? ` · ${whereText(x.where)}` : ''}${x.sessionStart ? ` · since ${when(x.sessionStart)}` : ` · ${x.id.slice(0, 8)}`}${x.model ? ` · ${modelName(x.model)}` : ''}`))])) : '',
    shownWhere ? T(`${whereText(shownWhere)}${pick ? ' · fixed session' : ' · following the newest session'}`, 'dim') : '',
    vitalsCard,
    ...lay.order.filter(id => !lay.hidden.includes(id)).map(id => byId[id]?.()),
    T((isCalibrated ? 'Cost is Claude Code’s own total. Each row’s cost is its tokens at list price, scaled so the rows add up to that total.' : 'Cost is an estimate at list price until Claude Code reports the session cost.') + ' Cost per request = cost ÷ requests, both from the same transcript read. Weighted = input ×1 + cache write ×1.25 (five-minute cache) or ×2 (one-hour cache) + cache read ×0.1 + output ×5. Fresh = input + cache write + output.', 'foot dim'),
  )

  // CSV, as the pane's Copy buttons build it.
  function tasksCsv() { return ['task,started,minutes,calls,input,cache_write,cache_read,output,usd', ...list.map(t => { const u = taskTotal(t); return [JSON.stringify(t.label), new Date(t.startedAt).toISOString(), mins(t), u.calls, u.input, u.cacheWrite, u.cacheRead, u.output, (u.usd * factor).toFixed(4)].join(',') })].join('\n') }
  function callsCsv() { return ['time,task,who,model,input,cache_write,cache_read,output,usd', ...callList.map(c => [new Date(c.at).toISOString(), JSON.stringify(c.task), JSON.stringify(c.who), c.model, c.input, c.cacheWrite, c.cacheRead, c.output, (c.usd * factor).toFixed(4)].join(','))].join('\n') }
}
async function copy(ev, text) {
  const note = root.querySelector('.copied')
  try { await navigator.clipboard.writeText(text); if (note) note.textContent = 'Copied.' }
  catch { if (note) note.textContent = 'Copy failed: your browser refused the clipboard.' }
}
draw()
// The page's database: every session's state, newest first, and the shared plan limits. Without it the state
// built into the page shows.
// Where a session runs, as the mod recorded it: cloud or local, and its folder.
const whereText = w => w ? `${w.kind === 'cloud' ? '☁️ cloud' : '💻 local'}${w.folder ? ` · ${w.folder}` : ''}` : ''
let shownWhere = null
function choose() {
  if (pick && sessions.length && !sessions.some(d => d.id === pick)) pick = null
  const x = sessions.find(d => d.id === pick) || sessions[0]
  shownWhere = x ? x.where || null : null
  if (x && x.state) S = x.state
  draw()
}
;(async () => {
  const db = typeof claude === 'undefined' ? null : await claude.use('db').catch(() => null)
  if (!db) return
  db.collection('sessions').orderBy('updatedAt', 'desc').limit(12).onSnapshot(snap => {
    sessions = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.state)
    choose()
  }, () => {})
  db.doc('limits/latest').onSnapshot(snap => { LIM = snap.exists ? snap.data() : null; draw() }, () => {})
})()
let w = root.clientWidth
new ResizeObserver(() => { if (root.clientWidth !== w) { w = root.clientWidth; draw() } }).observe(root)
})()
</script>
